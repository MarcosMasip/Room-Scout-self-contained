spring.application.name=room-scout
server.port=8080

# Self-contained: In-memory H2 database
spring.datasource.url=jdbc:h2:mem:roomscout;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Eureka for local self-contained mode
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Optional: disable AMQP auto-config to avoid RabbitMQ requirement
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Springdoc OpenAPI (Swagger UI)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true